services:
  api:
    build: .
    environment:
      DUFFEL_API_TOKEN: ${DUFFEL_API_TOKEN:-}
      REDIS_URL: redis://redis:6379/0
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: jojira_duffel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MESSAGE_BROKER: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
    depends_on:
      - redis
      - postgres
      - rabbitmq
    ports:
      - "8000:8000"

  order-processor:
    build:
      context: .
      dockerfile: Dockerfile.processor
    environment:
      DUFFEL_API_TOKEN: ${DUFFEL_API_TOKEN:-}
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: jojira_duffel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      MESSAGE_BROKER: rabbitmq
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      REDIS_URL: redis://redis:6379/0
    depends_on:
      - redis
      - postgres
      - rabbitmq

  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_DB: jojira_duffel
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  rabbitmq:
    image: rabbitmq:3-management-alpine
    restart: always
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

volumes:
  redis-data:
  postgres-data:
  rabbitmq-data: