apiVersion: v1
kind: Service
metadata:
  name: jojira-api-service
  namespace: jojira
spec:
  type: ClusterIP
  ports:
  - port: 8000
    targetPort: 8000
    name: http
  selector:
    app: jojira-api
---
apiVersion: v1
kind: Service
metadata:
  name: jojira-user-service
  namespace: jojira
spec:
  type: ClusterIP
  ports:
  - port: 8001
    targetPort: 8001
    name: http
  selector:
    app: jojira-user-service
