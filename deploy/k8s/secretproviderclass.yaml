# ==============================================================================
# Azure Key Vault Secrets Store CSI Driver Class
# Automatically syncs secrets from Azure Key Vault into Kubernetes Pod Secrets
# ==============================================================================
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: azure-keyvault-secrets-provider
  namespace: jojira
spec:
  provider: azure
  secretObjects:
  - secretName: jojira-secrets
    type: Opaque
    data:
    - objectName: duffel-api-token
      key: DUFFEL_API_TOKEN
    - objectName: openai-api-key
      key: OPENAI_API_KEY
    - objectName: gemini-api-key
      key: GEMINI_API_KEY
    - objectName: postgres-password
      key: POSTGRES_PASSWORD
    - objectName: rabbitmq-password
      key: RABBITMQ_PASSWORD
  parameters:
    usePodIdentity: "false"
    useVMManagedIdentity: "true"
    userAssignedIdentityID: "" # Populated by setup script
    keyvaultName: "jojira-kv"  # Azure Key Vault Name
    cloudName: ""
    objects:  |
      array:
        - |
          objectName: duffel-api-token
          objectType: secret
        - |
          objectName: openai-api-key
          objectType: secret
        - |
          objectName: gemini-api-key
          objectType: secret
        - |
          objectName: postgres-password
          objectType: secret
        - |
          objectName: rabbitmq-password
          objectType: secret
    tenantId: "00000000-0000-0000-0000-000000000000" # Azure Tenant ID
