apiVersion: apps/v1
kind: Deployment
metadata:
  name: jojira-api
  namespace: jojira
  labels:
    app: jojira-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jojira-api
  template:
    metadata:
      labels:
        app: jojira-api
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: api
        image: jojiraacr.azurecr.io/jojira-api:latest
        imagePullPolicy: Always
        command: ["python", "run_api.py", "--host", "0.0.0.0", "--port", "8000"]
        ports:
        - containerPort: 8000
          name: http
        envFrom:
        - configMapRef:
            name: jojira-config
        - secretRef:
            name: jojira-secrets
        resources:
          requests:
            cpu: 250m
            memory: 256Mi
          limits:
            cpu: 1000m
            memory: 512Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-keyvault-secrets-provider"
