apiVersion: apps/v1
kind: Deployment
metadata:
  name: jojira-user-service
  namespace: jojira
  labels:
    app: jojira-user-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: jojira-user-service
  template:
    metadata:
      labels:
        app: jojira-user-service
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
      - name: user-service
        image: jojiraacr.azurecr.io/jojira-user-service:latest
        imagePullPolicy: Always
        command: ["python", "run_user_service.py", "8001"]
        ports:
        - containerPort: 8001
          name: http
        envFrom:
        - configMapRef:
            name: jojira-config
        - secretRef:
            name: jojira-secrets
        resources:
          requests:
            cpu: 150m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
        readinessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: 8001
          initialDelaySeconds: 20
          periodSeconds: 20
        volumeMounts:
        - name: secrets-store-inline
          mountPath: "/mnt/secrets-store"
          readOnly: true
      volumes:
      - name: secrets-store-inline
        csi:
          driver: secrets-store.csi.k8s.io
          readOnly: true
          volumeAttributes:
            secretProviderClass: "azure-keyvault-secrets-provider"
